<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0b1020;
color:white;
overflow-x:hidden;
}

nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 8%;
background:rgba(0,0,0,.4);
backdrop-filter:blur(10px);
z-index:1000;
}

.logo{
font-size:28px;
font-weight:bold;
color:#00e5ff;
}

nav ul{
display:flex;
list-style:none;
gap:25px;
}

nav a{
color:white;
text-decoration:none;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:linear-gradient(135deg,#0b1020,#132347);
}

.hero h1{
font-size:60px;
margin-bottom:20px;
animation:fadeUp 1s ease;
}

.hero p{
max-width:700px;
font-size:20px;
opacity:.8;
}

.btn{
margin-top:30px;
padding:14px 35px;
background:#00e5ff;
color:black;
border:none;
border-radius:30px;
font-weight:bold;
cursor:pointer;
}

section{
padding:90px 8%;
}

.title{
text-align:center;
font-size:40px;
margin-bottom:50px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}
